      {t:25,r:240,g:160,b:30},{t:30,r:240,g:80,b:30},{t:35,r:220,g:30,b:30},{t:40,r:180,g:20,b:60}
    ];
    function lerpColor(temp) {
      let s;
      if (temp <= COLOR_STOPS[0].t) s = COLOR_STOPS[0];
      else if (temp >= COLOR_STOPS[COLOR_STOPS.length-1].t) s = COLOR_STOPS[COLOR_STOPS.length-1];
      else { for (let i = 0; i < COLOR_STOPS.length-1; i++) { if (temp >= COLOR_STOPS[i].t && temp <= COLOR_STOPS[i+1].t) { const f = (temp - COLOR_STOPS[i].t) / (COLOR_STOPS[i+1].t - COLOR_STOPS[i].t); s = { r: COLOR_STOPS[i].r + (COLOR_STOPS[i+1].r - COLOR_STOPS[i].r)*f, g: COLOR_STOPS[i].g + (COLOR_STOPS[i+1].g - COLOR_STOPS[i].g)*f, b: COLOR_STOPS[i].b + (COLOR_STOPS[i+1].b - COLOR_STOPS[i].b)*f }; break; } } }
      if (!s) s = COLOR_STOPS[COLOR_STOPS.length-1];
      return { r: s.r/255, g: s.g/255, b: s.b/255 };
    }
    function tempToCSS(t) { const c = lerpColor(t); return `rgb(${Math.round(c.r*255)},${Math.round(c.g*255)},${Math.round(c.b*255)})`; }
    function tempToThree(t) { const c = lerpColor(t); return new THREE.Color(c.r, c.g, c.b); }

    function addOutline(coords) {
      const pts = [];
      for (let i = 0; i < coords.length; i++) {
        const p = toXYZ(coords[i][0], coords[i][1]); pts.push(p);
        if (i < coords.length - 1) { const next = toXYZ(coords[i+1][0], coords[i+1][1]); if (p.distanceTo(next) > 0.8) { if (pts.length > 1) landGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lineMat)); pts.length = 0; } }
      }
      if (pts.length > 1) { pts.push(pts[0].clone()); landGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lineMat)); }
    }

    function decodeTopojson(topology, obj) {
      const { scale, translate } = topology.transform, arcs = topology.arcs;
      function decodeArc(idx) { const raw = idx < 0 ? arcs[~idx] : arcs[idx]; let x = 0, y = 0; const pts = raw.map(d => { x += d[0]; y += d[1]; return [x*scale[0]+translate[0], y*scale[1]+translate[1]]; }); if (idx < 0) pts.reverse(); return pts; }
      function decodeRing(indices) { let coords = []; for (const idx of indices) { const arc = decodeArc(idx); if (coords.length) arc.shift(); coords = coords.concat(arc); } return coords; }
      return obj.geometries.map(g => { const coords = g.arcs.map(a => Array.isArray(a[0]) ? a.map(r => decodeRing(r)) : decodeRing(a)); return { type: g.type, coordinates: g.type === 'MultiPolygon' ? coords : coords[0], properties: g.properties || {}, id: g.id }; });
    }

    const landPolygons = [];
    let spainMainland = null;
    let canariasRings = [], balearesRings = [];

    function pointInPolygon(lon, lat, poly) {
      let inside = false;
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
        if ((yi > lat) !== (yj > lat) && lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) inside = !inside;
      }
      return inside;
    }
    function polygonArea(poly) {
      let s = 0;
      for (let i = 0; i < poly.length; i++) { const p = poly[i], n = poly[(i + 1) % poly.length]; s += p[0] * n[1] - n[0] * p[1]; }
      return Math.abs(s / 2);
    }
    function isOnLand(lon, lat) { for (const poly of landPolygons) { if (pointInPolygon(lon, lat, poly)) return true; } return false; }

    // Silueta simplificada de la península (respaldo si falla countries-110m).
    // Sigue la costa y las fronteras con Portugal y Francia, sin líneas visibles.
    const SPAIN_PENINSULA_FALLBACK = [
      [-9.3,43.7],[-8.9,43.75],[-8.2,43.75],[-7.5,43.75],[-6.5,43.7],[-5.5,43.6],
      [-4.5,43.5],[-3.5,43.45],[-2.5,43.4],[-1.78,43.37],[-1.5,43.3],[-1.2,43.2],
      [-0.9,43.05],[-0.5,42.95],[-0.1,42.9],[0.3,42.82],[0.7,42.75],[1.1,42.73],
      [1.5,42.75],[1.9,42.7],[2.2,42.55],[2.6,42.45],[3.0,42.43],[3.17,42.43],
      [3.2,42.0],[2.9,41.4],[2.2,41.0],[1.5,40.9],[0.8,40.4],[0.0,40.0],
      [-0.3,39.5],[-0.5,38.9],[-0.7,38.3],[-0.9,37.8],[-1.0,37.4],[-1.5,36.9],
      [-2.0,36.8],[-2.5,36.72],[-3.5,36.72],[-4.4,36.72],[-5.3,36.0],[-5.6,36.0],
      [-5.9,36.3],[-6.3,36.5],[-6.9,37.0],[-7.2,37.15],[-7.47,37.19],[-7.5,37.6],
      [-7.4,38.0],[-7.4,38.4],[-7.5,38.8],[-7.5,39.2],[-7.4,39.6],[-7.2,39.9],
      [-7.3,40.2],[-7.2,40.6],[-7.1,41.0],[-7.0,41.2],[-6.9,41.5],[-6.8,41.8],
      [-6.9,42.0],[-7.0,42.2],[-7.5,42.25],[-8.0,42.1],[-8.5,42.05],[-8.87,41.86],
      [-8.9,42.2],[-9.0,42.5],[-9.3,43.0]
    ];
    function isSpain(lon, lat) { return pointInPolygon(lon, lat, spainMainland || SPAIN_PENINSULA_FALLBACK); }

    async function loadLand() {
      const res = await apiFetch('https://cdn.jsdelivr.net/npm/world-atlas@2/land-50m.json');
      const topo = await res.json();
      const geoms = decodeTopojson(topo, topo.objects.land);
      for (const g of geoms) {
        if (g.type === 'Polygon') {
          landPolygons.push(g.coordinates[0]);
          addOutline(g.coordinates[0]);
        } else if (g.type === 'MultiPolygon') {
          for (const poly of g.coordinates) {
            landPolygons.push(poly[0]);
            addOutline(poly[0]);
          }
        }
      }
    }

    // Delimitación territorial de España: península, Canarias y Baleares como
    // entes independientes. Se buscan los anillos de España en countries-50m.
    async function loadSpainShape() {
      const res = await apiFetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json');
      const topo = await res.json();
      const geoms = decodeTopojson(topo, topo.objects.countries);
      const MAD_LON = -3.7, MAD_LAT = 40.4;
      const isSpainGeom = (g) => {
        const p = g.properties || {};
        return p.name === 'Spain' || p.ADMIN === 'Spain' ||
          g.id === '724' || g.id === 724 ||
          p.ADM0_A3 === 'ESP' || p.adm0_a3 === 'ESP' ||
          p.ISO_A3 === 'ESP' || p.iso_a3 === 'ESP';
      };
      const ringsOf = (g) => {
        if (g.type === 'Polygon') return [g.coordinates[0]];
        if (g.type === 'MultiPolygon') return g.coordinates.map(poly => poly[0]);
        return [];
      };
      const centroid = (ring) => {
        let sx = 0, sy = 0;
        for (const q of ring) { sx += q[0]; sy += q[1]; }
        return [sx / ring.length, sy / ring.length];
      };
      const sp = geoms.find(isSpainGeom);
      if (sp) {
        for (const ring of ringsOf(sp)) {
          if (!ring || ring.length < 4) continue;
          if (pointInPolygon(MAD_LON, MAD_LAT, ring)) {
            if (!spainMainland || polygonArea(ring) < polygonArea(spainMainland)) spainMainland = ring;
            continue;
          }
          const [cx, cy] = centroid(ring);
          if (cy < 36 && cx < -10) canariasRings.push(ring);
          else if (cx >= 1 && cx <= 4.5 && cy >= 38.4 && cy <= 40.3) balearesRings.push(ring);
        }
      }
      // Respaldo: anillo más pequeño que contenga Madrid (solo península)
      if (!spainMainland) {
        let best = null, bestArea = Infinity;
        const consider = (ring) => {
          if (!ring || ring.length < 4) return;
          if (!pointInPolygon(MAD_LON, MAD_LAT, ring)) return;
          const a = polygonArea(ring);
          if (a < bestArea) { bestArea = a; best = ring; }
        };
        for (const g of geoms) {
          if (g.type === 'Polygon') consider(g.coordinates[0]);
          else if (g.type === 'MultiPolygon') for (const poly of g.coordinates) consider(poly[0]);
        }
        if (best) spainMainland = best;
      }
    }

    async function fetchTemperatures() {
      const cached = getCache();
      if (cached) return cached;
      const results = [], batch = 10;
      for (let i = 0; i < CITIES.length; i += batch) {
        const slice = CITIES.slice(i, i + batch);
        const lats = slice.map(c => c.lat).join(','), lons = slice.map(c => c.lon).join(',');
        setStatus(`Cargando clima... ${i}/${CITIES.length}`);
        try {
          const res = await apiFetch(`${API}?latitude=${lats}&longitude=${lons}&current=temperature_2m`);
          const data = await res.json(), items = Array.isArray(data) ? data : [data];
          for (let j = 0; j < items.length; j++) {
            if (items[j]?.current?.temperature_2m !== undefined)
              results.push({ name: slice[j].n, lat: slice[j].lat, lon: slice[j].lon, temp: items[j].current.temperature_2m, island: isIsland(slice[j]) });
          }
        } catch (e) { console.error(`Lote ${i}:`, e.message); }
        await new Promise(r => setTimeout(r, 200));
      }
      if (results.length) setCache(results);
      return results;
    }

    function haversine(lat1, lon1, lat2, lon2) {
      const toRad = x => x * Math.PI / 180;
      const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
      return 6371 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function idwInterpolate(lat, lon, cityData, power = 2.5) {
      let wSum = 0, vSum = 0;
      for (const c of cityData) {
        const d = haversine(lat, lon, c.lat, c.lon);
        if (d < 0.1) return c.temp;
        const w = 1 / Math.pow(d, power);
        wSum += w; vSum += w * c.temp;
      }
      return vSum / wSum;
    }

    // Territorio de cada ciudad: península, Canarias, Baleares o África (Ceuta/Melilla)
    function territory(c) {
      if (c.name === 'Ceuta' || c.name === 'Melilla') return 'africa';
      if (c.lat < 35.5 && c.lon < -9) return 'canarias';
      if (c.lon >= 1.0 && c.lon <= 4.5 && c.lat >= 38.5 && c.lat <= 40.1) return 'baleares';
      return 'mainland';
    }

    function inRings(lon, lat, rings) {
      for (const r of rings) { if (pointInPolygon(lon, lat, r)) return true; }
      return false;
    }

    const CAN_BBOX = [-18.5, -13.0, 27.5, 29.7]; // lonMin, lonMax, latMin, latMax
    const BAL_BBOX = [1.0, 4.4, 38.6, 40.1];

    function inBboxLand(lon, lat, bb) {
      return lon >= bb[0] && lon <= bb[1] && lat >= bb[2] && lat <= bb[3] && isOnLand(lon, lat);
    }

    function addGradientGrid(latMin, latMax, lonMin, lonMax, step, radius, mask, cities) {
      if (!cities.length) return;
      const pts = [];
      for (let lat = latMin; lat <= latMax; lat += step) {
        for (let lon = lonMin; lon <= lonMax; lon += step) {
          if (!mask(lon, lat)) continue;
          pts.push({ lat, lon, temp: idwInterpolate(lat, lon, cities) });
        }
      }
      if (!pts.length) return;
      const gridGeo = new THREE.SphereGeometry(radius, 6, 6);
      const gridMat = new THREE.MeshBasicMaterial();
      const inst = new THREE.InstancedMesh(gridGeo, gridMat, pts.length);
      const m = new THREE.Matrix4(), col = new THREE.Color();
      pts.forEach((p, i) => {
        m.makeTranslation(...toXYZSurface(p.lon, p.lat).toArray());
        inst.setMatrixAt(i, m);
        const c = lerpColor(p.temp);
        inst.setColorAt(i, col.setRGB(c.r, c.g, c.b));
      });
      inst.instanceMatrix.needsUpdate = true;
      if (inst.instanceColor) inst.instanceColor.needsUpdate = true;
      tempGroup.add(inst);
    }

    function placeData(data) {
      const mainland = data.filter(c => territory(c) === 'mainland');
      const canarias = data.filter(c => territory(c) === 'canarias');
      const baleares = data.filter(c => territory(c) === 'baleares');
      const africa = data.filter(c => territory(c) === 'africa');

      // Península: puntos pequeños y solapados, recortados a su silueta
      addGradientGrid(36.0, 43.9, -9.5, 4.5, 0.13, 0.0016, (lon, lat) => isSpain(lon, lat), mainland);
      // Canarias como ente independiente: solo sus islas, solo sus ciudades
      addGradientGrid(CAN_BBOX[2], CAN_BBOX[3], CAN_BBOX[0], CAN_BBOX[1], 0.09, 0.0016,
        (lon, lat) => canariasRings.length ? inRings(lon, lat, canariasRings) : inBboxLand(lon, lat, CAN_BBOX), canarias);
      // Baleares como ente independiente: solo sus islas, solo sus ciudades
      addGradientGrid(BAL_BBOX[2], BAL_BBOX[3], BAL_BBOX[0], BAL_BBOX[1], 0.07, 0.0016,
        (lon, lat) => balearesRings.length ? inRings(lon, lat, balearesRings) : inBboxLand(lon, lat, BAL_BBOX), baleares);
      // Ceuta y Melilla: puntos individuales con su temperatura
      const dotGeo = new THREE.SphereGeometry(0.007, 10, 10);
      for (const c of africa) {
        const dot = new THREE.Mesh(dotGeo, new THREE.MeshBasicMaterial({ color: tempToThree(c.temp) }));
        dot.position.copy(toXYZSurface(c.lon, c.lat));
        tempGroup.add(dot);
      }
    }

    function buildLegend() {
      const el = document.getElementById('legend');
      if (mode === 'air') {
        el.innerHTML = `<h3>Calidad del aire (AQI europeo)</h3>` +
          AQI_LEVELS.map(l => `<div class="legend-row"><div class="legend-color" style="background:${l.c}"></div>${l.n}</div>`).join('');
        return;
      }
      const ranges = [
        {l:'< 0°C',t:-2},{l:'0-5°C',t:2.5},{l:'5-10°C',t:7.5},{l:'10-15°C',t:12.5},
        {l:'15-20°C',t:17.5},{l:'20-25°C',t:22.5},{l:'25-30°C',t:27.5},{l:'30-35°C',t:32.5},{l:'> 35°C',t:37}
      ];
      el.innerHTML = `<h3>Temperatura (°C)</h3>` + ranges.map(r => `<div class="legend-row"><div class="legend-color" style="background:${tempToCSS(r.t)}"></div>${r.l}</div>`).join('');
    }

    function getAqCache() { try { const r = localStorage.getItem(AQ_CACHE_KEY); if (!r) return null; const c = JSON.parse(r); if (Date.now() - c.ts > AQ_TTL) return null; return c.data; } catch { return null; } }
    function setAqCache(d) { try { localStorage.setItem(AQ_CACHE_KEY, JSON.stringify({ ts: Date.now(), data: d })); } catch {} }

    function currentHourIndex(times) {
      const now = Date.now();
      let idx = 0;
      for (let i = 0; i < times.length; i++) {
        const t = Date.parse(times[i].length === 16 ? times[i] + ':00Z' : times[i]);
        if (isNaN(t)) continue;
        if (t <= now) idx = i; else break;
      }
      return idx;
    }

    async function fetchAirQuality() {
      const cached = getAqCache();
      if (cached) return cached;
      const results = [], batch = 10;
      for (let i = 0; i < AQ_CITIES.length; i += batch) {
        const slice = AQ_CITIES.slice(i, i + batch);
        const lats = slice.map(c => c.lat).join(','), lons = slice.map(c => c.lon).join(',');
        setStatus(`Cargando aire... ${i}/${AQ_CITIES.length}`);
        try {
          const res = await apiFetch(`${AQ_API}?latitude=${lats}&longitude=${lons}&hourly=${AQ_VARS}`);
          const data = await res.json(), items = Array.isArray(data) ? data : [data];
          for (let j = 0; j < items.length; j++) {
            const h = items[j]?.hourly;
            if (!h?.time?.length) continue;
            const k = currentHourIndex(h.time);
            const val = (key) => h[key]?.[k] ?? null;
            const p = {
              pm10: val('pm10'), pm2_5: val('pm2_5'), ozone: val('ozone'),
              sulphur_dioxide: val('sulphur_dioxide'), nitrogen_dioxide: val('nitrogen_dioxide'),
              carbon_dioxide: val('carbon_dioxide'), carbon_monoxide: val('carbon_monoxide')
            };
            results.push({ name: slice[j].n, lat: slice[j].lat, lon: slice[j].lon, p, aqi: overallAQI(p) });
          }
        } catch (e) { console.error(`Aire lote ${i}:`, e.message); }
        await new Promise(r => setTimeout(r, 200));
      }
      if (results.length) setAqCache(results);
      return results;
    }

    function fmt(v) { return v == null ? '—' : (Math.round(v * 10) / 10); }

    function placeAirDots(data) {
      const geo = new THREE.SphereGeometry(0.007, 10, 10);
      for (const c of data) {
        const dot = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: new THREE.Color(AQI_LEVELS[c.aqi].c) }));
        dot.position.copy(toXYZSurface(c.lon, c.lat));
        aqGroup.add(dot);
      }
    }

    function buildAqPanel(data) {
      const rows = data.map(c => {
        const lvl = AQI_LEVELS[c.aqi];
        return `<div class="aq-city"><div class="aq-head"><span class="aq-name">${c.name}</span>` +
          `<span class="aq-badge" style="background:${lvl.c}">${lvl.n}</span></div>` +
          `<div class="aq-grid">` +
          `<span>PM2.5 <b>${fmt(c.p.pm2_5)}</b></span><span>PM10 <b>${fmt(c.p.pm10)}</b></span>` +
          `<span>O₃ <b>${fmt(c.p.ozone)}</b></span><span>NO₂ <b>${fmt(c.p.nitrogen_dioxide)}</b></span>` +
          `<span>SO₂ <b>${fmt(c.p.sulphur_dioxide)}</b></span><span>CO <b>${fmt(c.p.carbon_monoxide)}</b></span>` +
          `<span>CO₂ <b>${fmt(c.p.carbon_dioxide)}</b></span><span>µg/m³</span>` +
          `</div></div>`;
      }).join('');
      document.getElementById('aq-list').innerHTML = rows;
    }

    async function ensureAir() {
      if (aqData || aqLoading) return;
      aqLoading = true;
      try {
        setStatus('Cargando aire...');
        aqData = await fetchAirQuality();
        placeAirDots(aqData);
        buildAqPanel(aqData);
        setStatus(`${aqData.length} ciudades con aire`);
      } catch (e) { console.error(e); setStatus('Error aire: ' + e.message); }
      aqLoading = false;
      setTimeout(() => { if (mode === 'temp') statusEl.style.opacity = '0'; }, 3000);
    }

    function setMode(m) {
      mode = m;
      tempGroup.visible = (m === 'temp');
      aqGroup.visible = (m === 'air');
      document.getElementById('tab-temp').classList.toggle('active', m === 'temp');
      document.getElementById('tab-air').classList.toggle('active', m === 'air');
      document.getElementById('aq-panel').style.display = m === 'air' ? 'flex' : 'none';
      buildLegend();
      if (m === 'air') { statusEl.style.opacity = '1'; ensureAir(); }
      else if (aqData) setStatus(`${aqData.length} ciudades con aire`);
    }

    async function init() {
      try { setStatus('Cargando mapa...'); await loadLand(); } catch (e) { console.error(e); setStatus('Error mapa: ' + e.message); return; }
      try { await loadSpainShape(); } catch (e) { console.warn('Sin frontera precisa, uso silueta local:', e.message); }
      try { setStatus('Cargando clima...'); const data = await fetchTemperatures(); placeData(data); buildLegend(); setStatus(`${data.length} ciudades listas`); }
      catch (e) { console.error(e); setStatus('Error clima: ' + e.message); }
      document.getElementById('tab-temp').addEventListener('click', () => setMode('temp'));
      document.getElementById('tab-air').addEventListener('click', () => setMode('air'));
      setTimeout(() => { statusEl.style.opacity = '0'; }, 3000);
    }
    init();

    window.addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
    (function animate() { requestAnimationFrame(animate); controls.update(); ring.lookAt(camera.position); renderer.render(scene, camera); })();
  </script>
</body>
</html>
